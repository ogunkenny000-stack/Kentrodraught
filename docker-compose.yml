# Convenience wrapper around the Dockerfile. Put your values in a .env file
# next to this compose file (compose reads it automatically):
#
#   VITE_SUPABASE_URL=https://YOURPROJECT.supabase.co
#   VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_...
#   SUPABASE_URL=https://YOURPROJECT.supabase.co
#   SUPABASE_SECRET_KEY=sb_secret_...
#   SUPABASE_DB_URL=postgresql://postgres:PASSWORD@db.YOURPROJECT.supabase.co:5432/postgres
#   BOOTSTRAP_ADMIN_UID=your-authenticated-supabase-user-uuid
#
# then:  docker compose up -d --build
services:
  draught:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    volumes:
      - kentro_game_data:/app/data
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      BOOTSTRAP_ADMIN_UID: ${BOOTSTRAP_ADMIN_UID:-}
      SKIP_DB_MIGRATION: "1"
    restart: unless-stopped
    init: true
    stop_grace_period: 10s

# Preserve match records and sequence IDs across container restarts.
volumes:
  kentro_game_data:
